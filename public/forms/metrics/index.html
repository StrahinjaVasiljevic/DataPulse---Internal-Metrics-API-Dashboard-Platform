<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Submit Metric</title>
</head>
<body>
  <h1>Metric form</h1>

  <form id="f">
    <input id="name" placeholder="Metric name" /><br>
    <input id="value" placeholder="Value" /><br>
    <input id="source" placeholder="Source" /><br>
    <button>Submit</button>
  </form>

  <pre id="out"></pre>

  <script>
    f.onsubmit = async e => {
      e.preventDefault();
      const r = await fetch('/ui/metric-submissions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name.value,
          value: value.value,
          source: source.value
        })
      });
      out.textContent = await r.text();
    };
  </script>
</body>
</html>
